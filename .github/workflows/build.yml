name: Build Jukebox Range Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download Jukebox v3.6.2
        shell: bash
        run: |
          git clone https://github.com/Fleeym/jukebox.git source
          cd source
          git checkout e01e872

      - name: Apply Range downloader
        working-directory: source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = list(Path(".").rglob("hosted.cpp"))

          print("Found hosted.cpp:")
          for p in files:
              print("  ", p)

          if not files:
              raise RuntimeError("hosted.cpp not found")

          p = files[0]
          s = p.read_text()

          marker = "startHostedDownload"
          pos = s.find(marker)

          if pos == -1:
              raise RuntimeError("startHostedDownload not found")

          start = s.rfind("arc::Future", 0, pos)
          brace = s.find("{", pos)

          if start == -1 or brace == -1:
              raise RuntimeError("Could not locate function")

          depth = 0
          end = None

          for i in range(brace, len(s)):
              if s[i] == "{":
                  depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise RuntimeError("Could not locate function end")

          replacement = r'''arc::Future<Result<ByteVector>> startHostedDownload(const std::string_view url) {
              int timeout = Mod::get()->getSettingValue<int>("download-timeout");
              if (timeout < 30) timeout = 30;

              constexpr size_t CHUNK_SIZE = 10000;
              constexpr int MAX_RETRIES = 3;

              const auto requestTimeout = std::chrono::seconds(timeout);
              const std::string urlString(url);

              const web::WebResponse head =
                  co_await web::WebRequest()
                      .timeout(requestTimeout)
                      .transferBody(false)
                      .get(urlString);

              if (!head.ok()) {
                  co_return Err(utils::web::getErrorFromResponse(head));
              }

              const auto length = head.header("Content-Length");

              if (!length) {
                  co_return Err("Server did not provide Content-Length");
              }

              size_t total = 0;

              try {
                  total = std::stoull(std::string(*length));
              }
              catch (...) {
                  co_return Err("Invalid Content-Length");
              }

              ByteVector result;
              result.reserve(total);

              for (size_t start = 0; start < total; start += CHUNK_SIZE) {
                  const size_t end =
                      std::min(start + CHUNK_SIZE - 1, total - 1);

                  const size_t expected = end - start + 1;
                  bool success = false;

                  for (int attempt = 0; attempt < MAX_RETRIES; ++attempt) {
                      const web::WebResponse response =
                          co_await web::WebRequest()
                              .timeout(requestTimeout)
                              .header("Accept-Encoding", "identity")
                              .downloadRange({start, end})
                              .get(urlString);

                      if (response.code() != 206)
                          continue;

                      const auto& data = response.data();

                      if (data.size() != expected)
                          continue;

                      result.insert(result.end(), data.begin(), data.end());
                      success = true;

                      break;
                  }

                  if (!success) {
                      co_return Err("Failed to download file chunk");
                  }
              }

              co_return Ok(std::move(result));
          }'''

          p.write_text(s[:start] + replacement + s[end:])

          print("SUCCESS: patched", p)
          PY

      - name: Set Geode version to 5.9.0
        working-directory: source
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("mod.json")

          if not path.exists():
              raise RuntimeError("mod.json not found")

          data = json.loads(path.read_text())

          old_version = data.get("geode")
          data["geode"] = "5.9.0"

          path.write_text(
              json.dumps(data, indent=4, ensure_ascii=False) + "\n"
          )

          print(f"Geode version: {old_version} -> {data['geode']}")
          PY

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: source
          combine: true
          sdk: 5.9.0
          target: Win64
          export-pdb: true
          build-config: RelWithDebInfo

      - name: Upload Geode
        uses: actions/upload-artifact@v4
        with:
          name: jukebox-range-fix-windows
          path: source/build/*.geode
