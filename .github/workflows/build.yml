name: Build Jukebox Range Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------------
      # 1. Download exact Jukebox v3.6.2
      # ------------------------------------------------------------
      - name: Download Jukebox v3.6.2
        shell: bash
        run: |
          git clone https://github.com/Fleeym/jukebox.git source
          cd source
          git checkout e01e872

      # ------------------------------------------------------------
      # 2. Apply HTTP Range downloader fix
      # ------------------------------------------------------------
      - name: Apply Range downloader fix
        working-directory: source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = list(Path(".").rglob("hosted.cpp"))

          print("Searching for hosted.cpp...")

          for p in files:
              print("Found:", p)

          if not files:
              raise RuntimeError("hosted.cpp not found")

          # Prefer the actual Jukebox source file.
          preferred = [
              p for p in files
              if str(p).replace("\\", "/").endswith(
                  "jukebox/jukebox/download/hosted.cpp"
              )
          ]

          p = preferred[0] if preferred else files[0]

          print("Patching:", p)

          s = p.read_text(encoding="utf-8")

          marker = "startHostedDownload"
          pos = s.find(marker)

          if pos == -1:
              raise RuntimeError(
                  "startHostedDownload not found in hosted.cpp"
              )

          start = s.rfind("arc::Future", 0, pos)

          if start == -1:
              raise RuntimeError(
                  "Could not locate start of startHostedDownload"
              )

          brace = s.find("{", pos)

          if brace == -1:
              raise RuntimeError(
                  "Could not locate function body"
              )

          depth = 0
          end = None

          for i in range(brace, len(s)):
              if s[i] == "{":
                  depth += 1

              elif s[i] == "}":
                  depth -= 1

                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise RuntimeError(
                  "Could not locate end of startHostedDownload"
              )

          replacement = r'''arc::Future<Result<ByteVector>> startHostedDownload(const std::string_view url) {
              int timeout = Mod::get()->getSettingValue<int>("download-timeout");

              if (timeout < 30) {
                  timeout = 30;
              }

              constexpr size_t CHUNK_SIZE = 10000;
              constexpr int MAX_RETRIES = 3;

              const auto requestTimeout =
                  std::chrono::seconds(timeout);

              const std::string urlString(url);

              // First request byte 0.
              //
              // This allows us to detect whether the server supports
              // HTTP range requests and obtain the total file size.
              web::WebResponse probe =
                  co_await web::WebRequest()
                      .timeout(requestTimeout)
                      .header("Accept-Encoding", "identity")
                      .downloadRange({0, 0})
                      .get(urlString);

              if (!probe.ok()) {
                  std::string err =
                      utils::web::getErrorFromResponse(probe);

                  log::error(
                      "File download failed while probing server. Error: {}",
                      err
                  );

                  co_return Err(std::move(err));
              }

              size_t total = 0;
              bool rangeSupported = false;

              // Expected format:
              //
              // Content-Range: bytes 0-0/TOTAL
              //
              if (auto contentRange =
                      probe.header("Content-Range")) {

                  const std::string range(*contentRange);

                  const auto slash = range.rfind('/');

                  if (
                      slash != std::string::npos &&
                      slash + 1 < range.size()
                  ) {
                      try {
                          const auto totalString =
                              range.substr(slash + 1);

                          if (totalString != "*") {
                              total =
                                  std::stoull(totalString);

                              rangeSupported =
                                  total > 0;
                          }
                      }
                      catch (...) {
                          rangeSupported = false;
                      }
                  }
              }

              // Some servers ignore Range and return the entire file.
              //
              // If that happens, use the data we already received.
              if (
                  probe.code() == 200 &&
                  !rangeSupported
              ) {
                  const auto& data = probe.data();

                  if (!data.empty()) {
                      co_return Ok(
                          ByteVector(
                              data.begin(),
                              data.end()
                          )
                      );
                  }
              }

              // If Content-Range wasn't supplied, try Content-Length.
              if (!rangeSupported) {
                  if (auto length =
                          probe.header("Content-Length")) {

                      try {
                          total =
                              std::stoull(
                                  std::string(*length)
                              );

                          rangeSupported =
                              total > 0;
                      }
                      catch (...) {
                          rangeSupported = false;
                      }
                  }
              }

              // Last-resort fallback:
              // download the complete file normally.
              if (!rangeSupported) {
                  web::WebResponse response =
                      co_await web::WebRequest()
                          .timeout(requestTimeout)
                          .header(
                              "Accept-Encoding",
                              "identity"
                          )
                          .get(urlString);

                  if (!response.ok()) {
                      std::string err =
                          utils::web::getErrorFromResponse(
                              response
                          );

                      co_return Err(std::move(err));
                  }

                  const auto& data = response.data();

                  if (data.empty()) {
                      co_return Err(
                          "Server returned an empty file"
                      );
                  }

                  co_return Ok(
                      ByteVector(
                          data.begin(),
                          data.end()
                      )
                  );
              }

              ByteVector result;
              result.reserve(total);

              // The probe already downloaded byte 0.
              const auto& firstData = probe.data();

              if (firstData.size() != 1) {
                  // If the server returned the complete file despite
                  // the range request, accept it.
                  if (firstData.size() >= total) {
                      co_return Ok(
                          ByteVector(
                              firstData.begin(),
                              firstData.end()
                          )
                      );
                  }

                  co_return Err(
                      "Invalid initial range response"
                  );
              }

              result.insert(
                  result.end(),
                  firstData.begin(),
                  firstData.end()
              );

              // Download the rest in small HTTP range requests.
              for (
                  size_t start = 1;
                  start < total;
                  start += CHUNK_SIZE
              ) {
                  const size_t end =
                      std::min(
                          start + CHUNK_SIZE - 1,
                          total - 1
                      );

                  const size_t expected =
                      end - start + 1;

                  bool success = false;

                  for (
                      int attempt = 0;
                      attempt < MAX_RETRIES;
                      ++attempt
                  ) {
                      const web::WebResponse response =
                          co_await web::WebRequest()
                              .timeout(requestTimeout)
                              .header(
                                  "Accept-Encoding",
                                  "identity"
                              )
                              .downloadRange({start, end})
                              .get(urlString);

                      if (response.code() != 206) {
                          continue;
                      }

                      const auto& data =
                          response.data();

                      if (data.size() != expected) {
                          continue;
                      }

                      result.insert(
                          result.end(),
                          data.begin(),
                          data.end()
                      );

                      success = true;

                      // Report progress.
                      const float progress =
                          static_cast<float>(
                              result.size()
                          ) /
                          static_cast<float>(
                              total
                          );

                      events::FileDownloadProgress(
                          urlString
                      ).send(
                          events::FileDownloadProgressData{
                              urlString,
                              progress
                          }
                      );

                      break;
                  }

                  if (!success) {
                      co_return Err(
                          "Failed to download file chunk"
                      );
                  }
              }

              if (result.size() != total) {
                  co_return Err(
                      "Downloaded file size does not match expected size"
                  );
              }

              co_return Ok(
                  std::move(result)
              );
          }'''

          patched = s[:start] + replacement + s[end:]

          p.write_text(
              patched,
              encoding="utf-8"
          )

          print("SUCCESS: Range downloader patched.")
          print("File:", p)
          PY

      # ------------------------------------------------------------
      # 3. Fix duplicate init() declaration in Geode SDK
      #
      # The current SDK source used by the build action can contain:
      #
      #     bool init();
      #
      # and later:
      #
      #     virtual bool init();
      #
      # Clang treats this as a redeclaration error.
      # ------------------------------------------------------------
      - name: Fix Geode SDK duplicate init declaration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          candidates = list(
              Path(".").rglob("CCFileUtilsWin32.h")
          )

          print("Searching for CCFileUtilsWin32.h...")

          for p in candidates:
              print("Found:", p)

          if not candidates:
              raise RuntimeError(
                  "CCFileUtilsWin32.h not found"
              )

          fixed = False

          for p in candidates:
              text = p.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              # Only modify the Geode SDK copy.
              normalized = str(p).replace("\\", "/")

              if "geode-sdk-clone" not in normalized:
                  continue

              old = """    bool init();
    virtual void addSearchPath(const char* path);
    virtual void removeSearchPath(const char* path);
    virtual gd::string getWritablePath();
    virtual gd::string getWritablePath2();
    virtual bool isFileExist(const gd::string& strFilePath);
    virtual bool isAbsolutePath(const gd::string& strPath);

    virtual bool init();
"""

              new = """    bool init();
    virtual void addSearchPath(const char* path);
    virtual void removeSearchPath(const char* path);
    virtual gd::string getWritablePath();
    virtual gd::string getWritablePath2();
    virtual bool isFileExist(const gd::string& strFilePath);
    virtual bool isAbsolutePath(const gd::string& strPath);
"""

              if old in text:
                  text = text.replace(
                      old,
                      new,
                      1
                  )

                  p.write_text(
                      text,
                      encoding="utf-8"
                  )

                  print(
                      "SUCCESS: removed duplicate init() from",
                      p
                  )

                  fixed = True
                  break

              # If the exact surrounding text differs,
              # remove only the second declaration.
              lines = text.splitlines(
                  keepends=True
              )

              init_indices = [
                  i
                  for i, line in enumerate(lines)
                  if line.strip() in (
                      "bool init();",
                      "virtual bool init();"
                  )
              ]

              if len(init_indices) >= 2:
                  second = init_indices[1]

                  if lines[second].strip() == "virtual bool init();":
                      del lines[second]

                      p.write_text(
                          "".join(lines),
                          encoding="utf-8"
                      )

                      print(
                          "SUCCESS: removed duplicate virtual init() from",
                          p
                      )

                      fixed = True
                      break

          if not fixed:
              raise RuntimeError(
                  "Could not find duplicate init() declaration"
              )
          PY

      # ------------------------------------------------------------
      # 4. Show exactly which SDK header is being used
      # ------------------------------------------------------------
      - name: Verify SDK header
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = list(
              Path(".").rglob("CCFileUtilsWin32.h")
          )

          for p in files:
              if "geode-sdk-clone" not in str(p).replace("\\", "/"):
                  continue

              print("")
              print("===== SDK HEADER =====")
              print(p)
              print("======================")

              text = p.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              for i, line in enumerate(
                  text.splitlines(),
                  1
              ):
                  if "init();" in line:
                      print(
                          f"{i}: {line}"
                      )
          PY

      # ------------------------------------------------------------
      # 5. Build using the Geode version specified by mod.json
      # ------------------------------------------------------------
      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: source
          sdk: given
          target: Win64
          combine: true
          export-pdb: false
          build-config: Release

      # ------------------------------------------------------------
      # 6. Upload resulting .geode
      # ------------------------------------------------------------
      - name: Upload Geode
        uses: actions/upload-artifact@v4
        with:
          name: jukebox-range-fix-windows
          path: |
            output/*.geode
            source/build/*.geode
