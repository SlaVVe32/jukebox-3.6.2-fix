name: Build Jukebox Range Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download Jukebox v3.6.2
        shell: bash
        run: |
          git clone https://github.com/Fleeym/jukebox.git source
          cd source
          git checkout e01e872

      - name: Apply Range downloader
        working-directory: source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = list(Path(".").rglob("hosted.cpp"))

          print("Found hosted.cpp:")
          for p in files:
              print("  ", p)

          if not files:
              raise RuntimeError("hosted.cpp not found")

          p = files[0]
          s = p.read_text()

          marker = "startHostedDownload"
          pos = s.find(marker)

          if pos == -1:
              raise RuntimeError("startHostedDownload not found")

          start = s.rfind("arc::Future", 0, pos)
          brace = s.find("{", pos)

          if start == -1 or brace == -1:
              raise RuntimeError("Could not locate function")

          depth = 0
          end = None

          for i in range(brace, len(s)):
              if s[i] == "{":
                  depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise RuntimeError("Could not locate function end")

          replacement = r'''arc::Future<Result<ByteVector>> startHostedDownload(const std::string_view url) {
              int timeout = Mod::get()->getSettingValue<int>("download-timeout");
              if (timeout < 30) timeout = 30;

              constexpr size_t CHUNK_SIZE = 10000;
              constexpr int MAX_RETRIES = 3;

              const auto requestTimeout = std::chrono::seconds(timeout);
              const std::string urlString(url);

              // First request one byte to determine whether the server
              // supports HTTP range requests and to obtain the total size.
              web::WebResponse probe =
                  co_await web::WebRequest()
                      .timeout(requestTimeout)
                      .header("Accept-Encoding", "identity")
                      .downloadRange({0, 0})
                      .get(urlString);

              if (!probe.ok()) {
                  co_return Err(utils::web::getErrorFromResponse(probe));
              }

              // A proper range response contains:
              //
              // Content-Range: bytes 0-0/TOTAL
              //
              // Use it instead of relying on HEAD/Content-Length.
              size_t total = 0;
              bool rangeSupported = false;

              if (auto contentRange = probe.header("Content-Range")) {
                  const std::string range(*contentRange);

                  const auto slash = range.rfind('/');

                  if (slash != std::string::npos && slash + 1 < range.size()) {
                      try {
                          const auto totalString = range.substr(slash + 1);

                          if (totalString != "*") {
                              total = std::stoull(totalString);
                              rangeSupported = total > 0;
                          }
                      }
                      catch (...) {
                          rangeSupported = false;
                      }
                  }
              }

              // Some servers ignore Range and return the complete file.
              // In that case we can simply use the response we already got.
              if (probe.code() == 200 && !rangeSupported) {
                  const auto& data = probe.data();

                  if (!data.empty()) {
                      co_return Ok(ByteVector(data.begin(), data.end()));
                  }
              }

              // If the server did not provide Content-Range, try
              // Content-Length from the actual GET response.
              if (!rangeSupported) {
                  if (auto length = probe.header("Content-Length")) {
                      try {
                          total = std::stoull(std::string(*length));
                          rangeSupported = total > 0;
                      }
                      catch (...) {
                          rangeSupported = false;
                      }
                  }
              }

              // Last-resort fallback: download the complete file.
              if (!rangeSupported) {
                  web::WebResponse response =
                      co_await web::WebRequest()
                          .timeout(requestTimeout)
                          .header("Accept-Encoding", "identity")
                          .get(urlString);

                  if (!response.ok()) {
                      co_return Err(utils::web::getErrorFromResponse(response));
                  }

                  const auto& data = response.data();

                  if (data.empty()) {
                      co_return Err("Server returned an empty file");
                  }

                  co_return Ok(ByteVector(data.begin(), data.end()));
              }

              ByteVector result;
              result.reserve(total);

              // The probe already downloaded byte 0.
              const auto& firstData = probe.data();

              if (firstData.size() != 1) {
                  // Some servers return more than one byte despite Range.
                  if (firstData.size() >= total) {
                      co_return Ok(ByteVector(firstData.begin(), firstData.end()));
                  }

                  co_return Err("Invalid initial range response");
              }

              result.insert(result.end(), firstData.begin(), firstData.end());

              for (size_t start = 1; start < total; start += CHUNK_SIZE) {
                  const size_t end =
                      std::min(start + CHUNK_SIZE - 1, total - 1);

                  const size_t expected = end - start + 1;
                  bool success = false;

                  for (int attempt = 0; attempt < MAX_RETRIES; ++attempt) {
                      const web::WebResponse response =
                          co_await web::WebRequest()
                              .timeout(requestTimeout)
                              .header("Accept-Encoding", "identity")
                              .downloadRange({start, end})
                              .get(urlString);

                      if (response.code() != 206)
                          continue;

                      const auto& data = response.data();

                      if (data.size() != expected)
                          continue;

                      result.insert(result.end(), data.begin(), data.end());
                      success = true;

                      break;
                  }

                  if (!success) {
                      co_return Err("Failed to download file chunk");
                  }
              }

              if (result.size() != total) {
                  co_return Err("Downloaded file size does not match expected size");
              }

              co_return Ok(std::move(result));
          }'''

          p.write_text(s[:start] + replacement + s[end:])

          print("SUCCESS: patched", p)
          PY

      - name: Set Geode version to 5.9.0
        working-directory: source
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("mod.json")

          if not path.exists():
              raise RuntimeError("mod.json not found")

          data = json.loads(path.read_text())

          old_version = data.get("geode")
          data["geode"] = "5.9.0"

          path.write_text(
              json.dumps(data, indent=4, ensure_ascii=False) + "\n"
          )

          print(f"Geode version: {old_version} -> {data['geode']}")
          PY

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: source
          combine: true
          sdk: 5.9.0
          target: Win64
          export-pdb: true
          build-config: RelWithDebInfo

      - name: Upload Geode
        uses: actions/upload-artifact@v4
        with:
          name: jukebox-range-fix-windows
          path: source/build/*.geode
