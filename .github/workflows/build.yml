name: Build Jukebox Range Fix

on:
  workflow_dispatch:
  push:
    branches:
      - range-fix-final

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download Jukebox v3.6.2
        shell: bash
        run: |
          git clone https://github.com/Fleeym/jukebox.git source
          cd source
          git checkout e01e872

      - name: Apply Range downloader
        working-directory: source
        shell: bash
        env:
          HOSTED_CPP_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("jukebox/jukebox/download/hosted.cpp")

          if not path.exists():
              raise RuntimeError(f"Missing source file: {path}")

          replacement = base64.b64decode(
              os.environ["HOSTED_CPP_B64"]
          ).decode("utf-8")

          path.write_text(replacement, encoding="utf-8")
          print(f"SUCCESS: replaced {path}")
          PY

      - name: Verify original Geode version
        working-directory: source
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("mod.json").read_text(encoding="utf-8"))

          if data.get("geode") != "5.3.0":
              raise RuntimeError(
                  f"Expected Geode 5.3.0, got {data.get('geode')!r}"
              )

          if data.get("version") != "3.6.2":
              raise RuntimeError(
                  f"Expected Jukebox 3.6.2, got {data.get('version')!r}"
              )

          print("Geode SDK:", data["geode"])
          print("Jukebox:", data["version"])
          PY

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: source
          combine: true
          sdk: given
          target: Win64
          export-pdb: true
          build-config: RelWithDebInfo

      - name: Show build output
        shell: bash
        run: |
          echo "Built .geode files:"
          find source -type f -name "*.geode" -print

      - name: Upload Geode
        uses: actions/upload-artifact@v4
        with:
          name: jukebox-range-fix-windows
          path: source/**/*.geode
          if-no-files-found: error
