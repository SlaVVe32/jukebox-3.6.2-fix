name: Build Jukebox Range Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download Jukebox v3.6.2
        shell: bash
        run: |
          git clone https://github.com/Fleeym/jukebox.git source
          cd source
          git checkout e01e872

      - name: Verify source
        working-directory: source
        shell: bash
        run: |
          test -f mod.json
          test -f jukebox/jukebox/download/hosted.cpp

          echo "Jukebox source:"
          git rev-parse HEAD

          echo "Geode version:"
          python -c "import json; print(json.load(open('mod.json'))['geode'])"

          echo "hosted.cpp:"
          pwd
          ls -l jukebox/jukebox/download/hosted.cpp

      - name: Apply Range downloader fix
        working-directory: source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("jukebox/jukebox/download/hosted.cpp")

          if not path.exists():
              raise RuntimeError(f"File not found: {path}")

          text = path.read_text(encoding="utf-8")

          marker = "arc::Future<Result<ByteVector>> startHostedDownload"

          start = text.find(marker)

          if start == -1:
              raise RuntimeError("startHostedDownload was not found")

          brace = text.find("{", start)

          if brace == -1:
              raise RuntimeError("Could not find function body")

          depth = 0
          end = None

          for i in range(brace, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise RuntimeError("Could not find function end")

          replacement = '''arc::Future<Result<ByteVector>> startHostedDownload(const std::string_view url) {
              int timeout = Mod::get()->getSettingValue<int>("download-timeout");

              if (timeout < 30) {
                  timeout = 30;
              }

              constexpr size_t CHUNK_SIZE = 10000;
              constexpr int MAX_RETRIES = 3;

              const auto requestTimeout = std::chrono::seconds(timeout);
              const std::string urlString(url);

              web::WebResponse probe =
                  co_await web::WebRequest()
                      .timeout(requestTimeout)
                      .header("Accept-Encoding", "identity")
                      .downloadRange({0, 0})
                      .get(urlString);

              if (!probe.ok()) {
                  std::string err =
                      utils::web::getErrorFromResponse(probe);

                  log::error(
                      "File download failed while probing server. Error: {}",
                      err
                  );

                  co_return Err(std::move(err));
              }

              size_t total = 0;

              if (auto contentRange = probe.header("Content-Range")) {
                  const std::string range(*contentRange);
                  const auto slash = range.rfind('/');

                  if (
                      slash != std::string::npos &&
                      slash + 1 < range.size()
                  ) {
                      try {
                          const auto totalString = range.substr(slash + 1);

                          if (totalString != "*") {
                              total = std::stoull(totalString);
                          }
                      }
                      catch (...) {
                          total = 0;
                      }
                  }
              }

              if (probe.code() == 200 && total == 0) {
                  const auto& data = probe.data();

                  if (!data.empty()) {
                      co_return Ok(
                          ByteVector(data.begin(), data.end())
                      );
                  }
              }

              if (total == 0) {
                  if (auto length = probe.header("Content-Length")) {
                      try {
                          total = std::stoull(std::string(*length));
                      }
                      catch (...) {
                          total = 0;
                      }
                  }
              }

              if (total == 0) {
                  web::WebResponse response =
                      co_await web::WebRequest()
                          .timeout(requestTimeout)
                          .header("Accept-Encoding", "identity")
                          .get(urlString);

                  if (!response.ok()) {
                      std::string err =
                          utils::web::getErrorFromResponse(response);

                      co_return Err(std::move(err));
                  }

                  const auto& data = response.data();

                  if (data.empty()) {
                      co_return Err("Server returned an empty file");
                  }

                  co_return Ok(
                      ByteVector(data.begin(), data.end())
                  );
              }

              const auto& firstData = probe.data();

              if (firstData.size() != 1) {
                  if (firstData.size() >= total) {
                      co_return Ok(
                          ByteVector(
                              firstData.begin(),
                              firstData.end()
                          )
                      );
                  }

                  co_return Err("Invalid initial range response");
              }

              ByteVector result;
              result.reserve(total);

              result.insert(
                  result.end(),
                  firstData.begin(),
                  firstData.end()
              );

              for (
                  size_t start = 1;
                  start < total;
                  start += CHUNK_SIZE
              ) {
                  const size_t end =
                      std::min(
                          start + CHUNK_SIZE - 1,
                          total - 1
                      );

                  const size_t expected = end - start + 1;
                  bool success = false;

                  for (
                      int attempt = 0;
                      attempt < MAX_RETRIES;
                      ++attempt
                  ) {
                      const web::WebResponse response =
                          co_await web::WebRequest()
                              .timeout(requestTimeout)
                              .header(
                                  "Accept-Encoding",
                                  "identity"
                              )
                              .downloadRange({start, end})
                              .get(urlString);

                      if (response.code() != 206) {
                          continue;
                      }

                      const auto& data = response.data();

                      if (data.size() != expected) {
                          continue;
                      }

                      result.insert(
                          result.end(),
                          data.begin(),
                          data.end()
                      );

                      success = true;

                      const float progress =
                          static_cast<float>(result.size()) /
                          static_cast<float>(total);

                      events::FileDownloadProgress(urlString).send(
                          events::FileDownloadProgressData{
                              urlString,
                              progress
                          }
                      );

                      break;
                  }

                  if (!success) {
                      co_return Err("Failed to download file chunk");
                  }
              }

              if (result.size() != total) {
                  co_return Err(
                      "Downloaded file size does not match expected size"
                  );
              }

              co_return Ok(std::move(result));
          }'''

          path.write_text(
              text[:start] + replacement + text[end:],
              encoding="utf-8"
          )

          print("SUCCESS: hosted.cpp patched")
          print(path)
          PY

      - name: Verify patch
        working-directory: source
        shell: bash
        run: |
          grep -n "startHostedDownload" jukebox/jukebox/download/hosted.cpp
          grep -n "downloadRange" jukebox/jukebox/download/hosted.cpp

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: source
          sdk: given
          target: Win64
          combine: true
          export-pdb: false
          build-config: Release

      - name: Upload Geode
        uses: actions/upload-artifact@v4
        with:
          name: jukebox-range-fix-windows
          path: output/*.geode
