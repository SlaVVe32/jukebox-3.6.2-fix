name: Build Jukebox Range Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download Jukebox v3.6.2
        shell: bash
        run: |
          git clone https://github.com/Fleeym/jukebox.git source
          cd source
          git checkout e01e872

      - name: Apply Range downloader
        working-directory: source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = list(Path(".").rglob("hosted.cpp"))

          print("Searching for hosted.cpp...")

          if not files:
              print("ERROR: hosted.cpp not found")
              print("Possible download-related files:")
              for p in Path(".").rglob("*"):
                  if "download" in str(p).lower():
                      print("  ", p)
              raise SystemExit(1)

          print("Found:")
          for p in files:
              print("  ", p)

          p = files[0]
          s = p.read_text(encoding="utf-8")

          marker = "startHostedDownload"
          pos = s.find(marker)

          if pos == -1:
              raise RuntimeError("startHostedDownload not found")

          start = s.rfind("arc::Future", 0, pos)

          if start == -1:
              raise RuntimeError("Could not find function declaration")

          brace = s.find("{", pos)

          if brace == -1:
              raise RuntimeError("Could not find function body")

          depth = 0
          end = None

          for i in range(brace, len(s)):
              if s[i] == "{":
                  depth += 1
              elif s[i] == "}":
                  depth -= 1

                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise RuntimeError("Could not find function end")

          replacement = r'''arc::Future<Result<ByteVector>> startHostedDownload(const std::string_view url) {
              int timeout = Mod::get()->getSettingValue<int>("download-timeout");
              if (timeout < 30)
                  timeout = 30;

              constexpr size_t CHUNK_SIZE = 10000;
              constexpr int MAX_RETRIES = 3;

              const auto requestTimeout = std::chrono::seconds(timeout);
              const std::string urlString(url);

              // Request the first byte to determine the total file size.
              const web::WebResponse probe =
                  co_await web::WebRequest()
                      .timeout(requestTimeout)
                      .header("Accept-Encoding", "identity")
                      .downloadRange({0, 0})
                      .get(urlString);

              if (!probe.ok()) {
                  co_return Err(utils::web::getErrorFromResponse(probe));
              }

              size_t total = 0;

              if (auto contentRange = probe.header("Content-Range")) {
                  const std::string range(*contentRange);
                  const auto slash = range.rfind('/');

                  if (slash != std::string::npos &&
                      slash + 1 < range.size()) {
                      try {
                          const auto totalString = range.substr(slash + 1);

                          if (totalString != "*") {
                              total = std::stoull(totalString);
                          }
                      }
                      catch (...) {
                          total = 0;
                      }
                  }
              }

              // If Content-Range was unavailable, try Content-Length.
              if (total == 0) {
                  if (auto length = probe.header("Content-Length")) {
                      try {
                          total = std::stoull(std::string(*length));
                      }
                      catch (...) {
                          total = 0;
                      }
                  }
              }

              // If the server ignored Range and returned the whole file,
              // use that response directly.
              if (probe.code() == 200) {
                  const auto& data = probe.data();

                  if (!data.empty()) {
                      co_return Ok(ByteVector(data.begin(), data.end()));
                  }
              }

              if (total == 0) {
                  co_return Err("Could not determine file size");
              }

              ByteVector result;
              result.reserve(total);

              // The probe should contain byte 0.
              const auto& firstData = probe.data();

              if (firstData.size() != 1) {
                  co_return Err("Invalid initial range response");
              }

              result.insert(result.end(), firstData.begin(), firstData.end());

              for (size_t start = 1; start < total; start += CHUNK_SIZE) {
                  const size_t end =
                      std::min(start + CHUNK_SIZE - 1, total - 1);

                  const size_t expected = end - start + 1;

                  bool success = false;

                  for (int attempt = 0;
                       attempt < MAX_RETRIES;
                       ++attempt) {

                      const web::WebResponse response =
                          co_await web::WebRequest()
                              .timeout(requestTimeout)
                              .header("Accept-Encoding", "identity")
                              .downloadRange({start, end})
                              .get(urlString);

                      if (response.code() != 206)
                          continue;

                      const auto& data = response.data();

                      if (data.size() != expected)
                          continue;

                      result.insert(
                          result.end(),
                          data.begin(),
                          data.end()
                      );

                      success = true;
                      break;
                  }

                  if (!success) {
                      co_return Err("Failed to download file chunk");
                  }
              }

              if (result.size() != total) {
                  co_return Err("Downloaded file size does not match expected size");
              }

              co_return Ok(std::move(result));
          }'''

          p.write_text(
              s[:start] + replacement + s[end:],
              encoding="utf-8"
          )

          print("")
          print("SUCCESS: patched", p)
          PY

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: source
          combine: true
          sdk: given
          target: Win64
          export-pdb: true
          build-config: RelWithDebInfo

      - name: Find built Geode
        shell: bash
        run: |
          echo "Searching for .geode files..."
          find source -type f -name "*.geode" -print

      - name: Upload Geode
        uses: actions/upload-artifact@v4
        with:
          name: jukebox-range-fix-windows
          path: source/**/*.geode
          if-no-files-found: error
